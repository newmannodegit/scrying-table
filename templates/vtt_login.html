<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Scrying Table - VTT: Player Login</title>
  <link rel="stylesheet" href="{{ url_for('static',filename='app.css',v='1.17.3') }}">
</head>
<body class="editor-page">
  <main class="editor-card narrow-card">
    <h1>The Scrying Table - VTT</h1>
    {% if player_name %}<p class="help-text">Player: <strong>{{ player_name }}</strong></p>{% endif %}
    {% if error %}<div class="message error">{{ error }}</div>{% endif %}
    {% if player_name and not error %}
      <form method="post" action="{{ url_for('vtt', player=player_key) }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="player" value="{{ player_key }}">
        <label for="password">Game password</label>
        <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
        <button class="primary-button">Enter VTT</button>
      </form>
    {% elif player_name and error == 'Incorrect game password.' %}
      <form method="post" action="{{ url_for('vtt', player=player_key) }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="player" value="{{ player_key }}">
        <label for="password">Game password</label>
        <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
        <button class="primary-button">Try again</button>
      </form>
    {% endif %}
    <p><a href="{{ url_for('player_portal') }}">Choose a different player</a> &nbsp; <a href="{{ url_for('player_help') }}">Player help</a></p>
  </main>
</body>
</html>
