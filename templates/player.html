<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Scrying Table - VTT: Player Login</title>
  <link rel="stylesheet" href="{{ url_for('static',filename='app.css',v='1.17.3') }}">
</head>
<body class="portal-page">
  <main class="portal-card player-login-card">
    <h1>Player Map</h1>
    <p class="portal-intro">Choose your player token and enter the shared game password.</p>
    {% if error %}<div class="message error">{{ error }}</div>{% endif %}
    {% if not players %}
      <div class="message error">No player-controlled tokens have been created yet.</div>
    {% elif not vtt_enabled %}
      <div class="message error">Player VTT access has not been enabled by the GM.</div>
    {% endif %}
    <form method="post" action="{{ url_for('player_portal') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label for="playerSelect">Player</label>
      <select id="playerSelect" name="player" required {% if not players %}disabled{% endif %}>
        <option value="">Choose your token…</option>
        {% for player in players %}
          <option value="{{ player.player_key }}" {% if request.form.get('player') == player.player_key %}selected{% endif %}>{{ player.name }}</option>
        {% endfor %}
      </select>
      <label for="password">Game password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" {% if not vtt_enabled %}disabled{% endif %}>
      <button class="primary-button" {% if not players or not vtt_enabled %}disabled{% endif %}>Enter Player Map</button>
    </form>
    <div class="portal-footer-links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('player_help') }}">Player help</a>
    </div>
  </main>
</body>
</html>
