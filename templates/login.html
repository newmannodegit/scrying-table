<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Scrying Table - GM Login</title>
  <link rel="stylesheet" href="{{ url_for('static',filename='app.css',v='1.17.3') }}">
  <script src="{{ url_for('static',filename='login.js',v='1.17.3') }}" defer></script>
</head>
<body class="editor-page">
  <main
    id="gmLoginApp"
    class="editor-card narrow-card gm-login-card"
    data-csrf-token="{{ csrf }}"
    data-next-path="{{ next_path }}"
  >
    <h1>The Scrying Table - GM Login</h1>
    {% if switched %}
      <div class="message success">The previous GM session has been signed out. Sign in as the GM you want to use.</div>
    {% endif %}
    <p class="help-text">Use your Game Master account. GM credentials are validated against the Scrying Table account file and are not stored by this page.</p>

    <div id="gmLoginMessage" class="message error" role="alert" hidden></div>

    <form id="gmLoginForm" autocomplete="on">
      <label for="gmUsername">GM username</label>
      <input id="gmUsername" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>

      <label for="gmPassword">Password</label>
      <input id="gmPassword" name="password" type="password" autocomplete="current-password" required>

      <div class="button-row gm-login-actions">
        <button id="gmLoginButton" class="primary-button" type="submit">Sign in</button>
        <a class="button-link" href="/">Home</a>
      </div>
    </form>
  </main>
</body>
</html>
